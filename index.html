<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" id="viewportMeta" content="width=1200, initial-scale=1.0" />
    <script>
      (function() {
        function adjustViewport() {
          var screenW = window.screen.width || window.innerWidth;
          if (screenW > 0 && screenW < 1200) {
            var scale = screenW / 1200;
            var meta = document.getElementById('viewportMeta');
            if (meta) {
              meta.setAttribute('content', 'width=1200, initial-scale=' + scale.toFixed(3) + ', minimum-scale=' + scale.toFixed(3) + ', maximum-scale=3.0, user-scalable=yes');
            }
          }
        }
        adjustViewport();
        window.addEventListener('resize', adjustViewport);
        window.addEventListener('orientationchange', adjustViewport);
      })();
    </script>
    <title>AIU SciComm Spark Competition</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
